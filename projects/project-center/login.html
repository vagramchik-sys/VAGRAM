<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход · Кабинет продавца</title><link rel="stylesheet" href="style.css"></head><body><main style="margin:8vh auto;max-width:520px;padding:24px"><div class="eyebrow">ЦЕНТР УПРАВЛЕНИЯ ПРОЕКТАМИ</div><h1 id="title">Вход в кабинет</h1><p id="intro">Все проекты, задачи и рабочие модули вашей команды.</p><form id="auth" class="panel"><label>Имя пользователя<input name="username" autocomplete="username" required minlength="3" maxlength="80"></label><br><label>Пароль<input name="password" type="password" autocomplete="current-password" required minlength="12" maxlength="200"></label><br><button id="submit" type="submit">Войти</button></form><div id="status" role="status"></div><p class="footnote">Используйте отдельный пароль для вашего центра управления.</p></main><script>
let setup=false;const status=document.getElementById('status');
fetch('/api/setup-status').then(r=>{if(!r.ok)throw Error('Сервер недоступен');return r.json()}).then(d=>{setup=d.needsSetup;if(setup){document.getElementById('title').textContent='Создайте администратора';document.getElementById('intro').textContent='Первый запуск: задайте имя и пароль от 12 символов для руководителя отдела.';document.getElementById('submit').textContent='Создать кабинет';document.querySelector('[name=password]').autocomplete='new-password'}}).catch(e=>status.textContent=e.message);
document.getElementById('auth').addEventListener('submit',async e=>{e.preventDefault();const button=document.getElementById('submit');button.disabled=true;try{const body=Object.fromEntries(new FormData(e.target));const r=await fetch(setup?'/api/setup':'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json();if(!r.ok)throw Error(d.error||'Не удалось войти');location.href='/';}catch(e){status.textContent=e.message}finally{button.disabled=false}});
</script></body></html>
